name = "uaparser_gleam"
version = "1.0.1"
description = "User Agent parsing for Gleam"
licences = ["Apache-2.0"]
gleam = ">= 1.14.0"

[repository]
type = "github"
user = "halostatue"
repo = "uaparser_gleam"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_regexp = ">= 1.1.1 and < 2.0.0"
capuchin_crypt = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
yay = ">= 2.0.2 and < 3.0.0"
gleamy_bench = ">= 0.6.0 and < 1.0.0"
glinter = ">= 2.14.0 and < 3.0.0"

[javascript.deno]
allow_read = ["gleam.toml", "test"]

[tools.glinter]
stats = true

[tools.glinter.rules]
label_possible = "off"
ffi_usage = "off"
function_complexity = "warning"
module_complexity = "warning"
